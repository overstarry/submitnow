[package]
name = "tokyo"
version = "0.1.0"
edition = "2021"

[dependencies]
# GPUI Framework
gpui = "0.2.2"
gpui-component = "0.4.0"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# HTTP Client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# URL Validation
url = "2.5"

# Random Key Generation
rand = "0.8"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# File System (platform-specific config directories)
directories = "5.0"

# UUID for submission IDs
uuid = { version = "1.0", features = ["v4", "serde"] }
